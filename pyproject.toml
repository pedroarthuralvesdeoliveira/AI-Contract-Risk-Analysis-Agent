[project]
name = "ai-challenge"
version = "0.1.0"
description = "AI Challenge for AI Backend Development"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.54.0",
    "joblib>=1.4.0",
    "paddleocr[all]>=3.3.2",
    "paddlepaddle>=3.2.2",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.12.5",
    "pymupdf>=1.26.6",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.5.0",
    "streamlit>=1.52.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
